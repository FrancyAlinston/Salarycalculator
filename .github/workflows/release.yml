name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build APKs
        run: ./gradlew test assembleDebug assembleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          
          # Copy Release APK
          if [ -f app/build/outputs/apk/release/Salarycalculator-release.apk ]; then
            cp app/build/outputs/apk/release/Salarycalculator-release.apk release-artifacts/Salarycalculator.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/Salarycalculator.apk
          fi

          # Copy Debug APK
          if [ -f app/build/outputs/apk/debug/Salarycalculator-debug.apk ]; then
            cp app/build/outputs/apk/debug/Salarycalculator-debug.apk release-artifacts/Salarycalculator-debug.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/Salarycalculator-debug.apk
          fi

          echo "Prepared Release Artifacts:"
          ls -lh release-artifacts/

      - name: Extract Semantic Tag & Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
            TAG="v${VERSION_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building release for tag: ${TAG}"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Salarycalculator-APKs
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Salary Calculator ${{ steps.get_version.outputs.tag }}"
          body: |
            ## Downloads & Assets 📦

            - **Stable Release (Production)**: [`Salarycalculator.apk`](https://github.com/FrancyAlinston/Salarycalculator/releases/download/${{ steps.get_version.outputs.tag }}/Salarycalculator.apk)
            - **Debug Version (Development)**: [`Salarycalculator-debug.apk`](https://github.com/FrancyAlinston/Salarycalculator/releases/download/${{ steps.get_version.outputs.tag }}/Salarycalculator-debug.apk)

            ---
            *Signed with keystore and optimized for standalone installation.*
          files: |
            release-artifacts/Salarycalculator.apk
            release-artifacts/Salarycalculator-debug.apk
          generate_release_notes: true
          make_latest: true
