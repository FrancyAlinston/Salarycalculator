name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build APKs
        run: ./gradlew test assembleDebug assembleRelease --stacktrace

      - name: Extract Semantic Tag & Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
            TAG="v${VERSION_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release target tag: ${TAG}"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.get_version.outputs.tag }}"
          
          # Search and copy Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "release-artifacts/Salarycalculator-${TAG}.apk"
          else
            echo "::error::Release APK not found in app/build/outputs/apk/release/"
            find app/build/outputs/apk/ -type f || true
            exit 1
          fi

          # Search and copy Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" "release-artifacts/Salarycalculator-${TAG}-debug.apk"
          else
            echo "::error::Debug APK not found in app/build/outputs/apk/debug/"
            find app/build/outputs/apk/ -type f || true
            exit 1
          fi

          echo "Successfully prepared artifacts:"
          ls -lh release-artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Salary Calculator ${{ steps.get_version.outputs.tag }}"
          body: |
            ## Downloads & Assets 📦

            - **Stable Release (Production)**: [`Salarycalculator-${{ steps.get_version.outputs.tag }}.apk`](https://github.com/FrancyAlinston/Salarycalculator/releases/download/${{ steps.get_version.outputs.tag }}/Salarycalculator-${{ steps.get_version.outputs.tag }}.apk)
            - **Debug Version (Development)**: [`Salarycalculator-${{ steps.get_version.outputs.tag }}-debug.apk`](https://github.com/FrancyAlinston/Salarycalculator/releases/download/${{ steps.get_version.outputs.tag }}/Salarycalculator-${{ steps.get_version.outputs.tag }}-debug.apk)

            ---
            *Signed with keystore and optimized for standalone installation.*
          files: |
            release-artifacts/Salarycalculator-${{ steps.get_version.outputs.tag }}.apk
            release-artifacts/Salarycalculator-${{ steps.get_version.outputs.tag }}-debug.apk
          generate_release_notes: true
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: false
