name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease
          cp app/build/outputs/apk/release/Salarycalculator-release.apk app/build/outputs/apk/release/Salarycalculator.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Salary Calculator ${{ github.ref_name }}"
          body: |
            ## Downloads & Assets 📦

            - **Stable Release (Production)**: [`Salarycalculator.apk`](https://github.com/FrancyAlinston/Salarycalculator/releases/download/${{ github.ref_name }}/Salarycalculator.apk)
            - **Debug Version (Development)**: [`Salarycalculator-debug.apk`](https://github.com/FrancyAlinston/Salarycalculator/releases/download/${{ github.ref_name }}/Salarycalculator-debug.apk)

            ---
            *Signed with keystore and optimized for standalone installation.*
          files: |
            app/build/outputs/apk/release/Salarycalculator.apk
            app/build/outputs/apk/debug/Salarycalculator-debug.apk
          generate_release_notes: true
