name: Forgejo Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build APKs
        run: ./gradlew test assembleDebug assembleRelease --stacktrace

      - name: Extract Semantic Tag & Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
            TAG="v${VERSION_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release target tag: ${TAG}"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.get_version.outputs.tag }}"
          
          # Search and copy Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "release-artifacts/Salarycalculator-${TAG}.apk"
          else
            echo "::error::Release APK not found in app/build/outputs/apk/release/"
            find app/build/outputs/apk/ -type f || true
            exit 1
          fi

          # Search and copy Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" "release-artifacts/Salarycalculator-${TAG}-debug.apk"
          else
            echo "::error::Debug APK not found in app/build/outputs/apk/debug/"
            find app/build/outputs/apk/ -type f || true
            exit 1
          fi

          echo "Successfully prepared artifacts:"
          ls -lh release-artifacts/

      - name: Extract Changelog Notes for Release
        id: changelog_notes
        run: |
          python3 - << 'EOF'
          import os
          tag = os.environ.get("RELEASE_TAG", "").lstrip("v")
          changelog_path = "CHANGELOG.md"
          notes = []
          if os.path.exists(changelog_path):
              with open(changelog_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              in_section = False
              for line in lines:
                  if line.startswith("## [") and f"[{tag}]" in line:
                      in_section = True
                      continue
                  elif in_section and line.startswith("## ["):
                      break
                  elif in_section:
                      if line.strip() != "---":
                          notes.append(line)
          changelog_body = "".join(notes).strip()
          header = f"""## Downloads & Assets 📦

- **Stable Release (Production)**: `Salarycalculator-v{tag}.apk`
- **Debug Version (Development)**: `Salarycalculator-v{tag}-debug.apk`

---

### What's Changed in this Release

{changelog_body}

---
*Signed with keystore and verified for standalone installation.*
"""
          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write(header)
          EOF
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.tag }}

      - name: Create or Update Forgejo Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Salary Calculator ${{ steps.get_version.outputs.tag }}"
          body_path: release_notes.md
          files: |
            release-artifacts/Salarycalculator-${{ steps.get_version.outputs.tag }}.apk
            release-artifacts/Salarycalculator-${{ steps.get_version.outputs.tag }}-debug.apk
          generate_release_notes: false
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
